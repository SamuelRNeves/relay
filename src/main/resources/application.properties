spring.application.name=relay

# Conexao com o Postgres do docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/relay
spring.datasource.username=relay
spring.datasource.password=relay

# O schema e responsabilidade do Flyway; o Hibernate so confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
